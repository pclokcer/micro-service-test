version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: rootdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d rootdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_USER=user_admin
      - DB_PASSWORD=user_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=user_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  company-service:
    build: ./company-service
    container_name: company-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_USER=company_admin
      - DB_PASSWORD=company_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=company_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_USER=order_admin
      - DB_PASSWORD=order_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=order_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_started

  transfer-service:
    build: ./transfer-service
    container_name: transfer-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_USER=transfer_admin
      - DB_PASSWORD=transfer_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transfer_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  wallet-service:
    build: ./wallet-service
    container_name: wallet-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DB_USER=wallet_admin
      - DB_PASSWORD=wallet_pass
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=wallet_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  pgdata:
  kafka_data:
